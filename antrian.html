<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambil Antrian - Cipta Hospital Indonesia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar__container">
            <a href="index.html" class="navbar__brand">
                <img src="asset/Cipta Hospital Indonesi-Blue & Black.svg" alt="Logo Cipta Hospital Indonesia">
            </a>

            <input type="checkbox" id="burger-menu" class="navbar__burger-checkbox" hidden>
            <label class="navbar__burger-label" for="burger-menu">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="navbar__menu">
                <li><a href="index.html#beranda" class="navbar__menu-link">Beranda</a></li>
                <li><a href="index.html#tentang" class="navbar__menu-link">Tentang</a></li>
                <li><a href="index.html#faq" class="navbar__menu-link">FAQ</a></li>
                <li id="nav-antrian-mobile" class="navbar__menu-button--mobile hidden">
                    <a href="antrian.html" class="navbar__menu-button-link">DAFTAR ANTRIAN</a>
                </li>
                <li id="nav-profile-mobile" class="navbar__menu-button--mobile hidden">
                    <a href="profile.html" class="navbar__menu-button-link--secondary">PROFIL</a>
                </li>
            </ul>

            <div id="nav-auth-desktop" class="navbar__auth-buttons hidden">
                <a href="antrian.html" class="navbar__button--desktop">DAFTAR ANTRIAN</a>
                <a href="profile.html" class="navbar__button--profile" title="Profil Pengguna">
                    <img src="asset/User.svg" alt="Profil">
                </a>
            </div>
        </div>
    </nav>

    <main class="page-background--form">
        <div class="auth-container">
            <div class="form-header">
                <h2>Ambil Nomor Antrian</h2>
            </div>

            <div class="auth-form-container">
                <form id="queueForm" class="auth-form">
                    <div class="form-group">
                        <label for="queue-service">Pilih Poli / Layanan</label>
                        <select id="queue-service" required>
                            <option value="" disabled selected>-- Pilih Layanan --</option>
                            <option value="Poli Umum">Poli Umum</option>
                            <option value="Poli Gigi">Poli Gigi</option>
                            <option value="Laboratorium">Laboratorium</option>
                            <option value="Radiologi">Radiologi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="queue-doctor">Pilih Dokter</label>
                        <select id="queue-doctor" required>
                            <option value="" disabled selected>-- Pilih Dokter --</option>
                            <option value="Dr. Budi Santoso">Dr. Budi Santoso (Umum)</option>
                            <option value="Dr. Citra Lestari">Dr. Citra Lestari (Umum)</option>
                            <option value="Dr. Anisa Putri">Dr. Anisa Putri (Gigi)</option>
                            <option value="Dr. David Maulana">Dr. David Maulana (Gigi)</option>
                            <option value="Tanpa Dokter">Staf Laboratorium / Radiologi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="queue-date">Pilih Tanggal</label>
                        <input type="date" id="queue-date" required>
                    </div>
                    <button type="submit" class="auth-button">Ambil Nomor Antrian</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
