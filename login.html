<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar - Cipta Hospital Indonesia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar__container">
            <a href="index.html" class="navbar__brand">
                <img src="asset/Cipta Hospital Indonesi-Blue & Black.svg" alt="Logo Cipta Hospital Indonesia">
            </a>

            <input type="checkbox" id="burger-menu" class="navbar__burger-checkbox" hidden>
            <label class="navbar__burger-label" for="burger-menu">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="navbar__menu">
                <li><a href="#beranda" class="navbar__menu-link">Beranda</a></li>
                <li><a href="#tentang" class="navbar__menu-link">Tentang</a></li>
                <li><a href="#faq" class="navbar__menu-link">FAQ</a></li>
                <li class="navbar__menu-button--mobile">
                    <button onclick="window.location.href='login.html'">MASUK / DAFTAR</button>
                </li>
            </ul>
            <button class="navbar__button--desktop" onclick="window.location.href='login.html'">MASUK / DAFTAR</button>
        </div>
    </nav>

    <main class="login-page">
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab auth-tab--active" id="login-tab">MASUK</div>
                <div class="auth-tab" id="register-tab">DAFTAR</div>
            </div>

            <div class="auth-form-container">
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="Masukkan email">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Masukkan password">
                    </div>
                    <div class="form-group-inline">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember-me">
                            <label for="remember-me">Remember Me</label>
                        </div>
                        <a href="#">Forget Password?</a>
                    </div>
                    <button type="submit" class="auth-button">MASUK</button>
                </form>

                <form id="registerForm" class="auth-form hidden">
                    <div class="form-group">
                        <label for="register-name">Nama</label>
                        <input type="text" id="register-name" placeholder="Masukkan nama">
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" placeholder="Masukkan password">
                    </div>
                    <div class="form-group">
                        <label for="register-phone">Nomor handphone</label>
                        <input type="tel" id="register-phone" placeholder="Masukkan nomor HP">
                    </div>
                    <div class="form-group">
                        <label for="register-email">Alamat E-Mail</label>
                        <input type="email" id="register-email" placeholder="Masukkan email">
                    </div>
                    <button type="submit" class="auth-button">DAFTAR</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Script sederhana untuk tab login/register
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        loginTab.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            loginTab.classList.add('auth-tab--active');
            registerTab.classList.remove('auth-tab--active');
        });

        registerTab.addEventListener('click', () => {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            loginTab.classList.remove('auth-tab--active');
            registerTab.classList.add('auth-tab--active');
        });
    </script>

</body>

</html>
